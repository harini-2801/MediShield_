services:
  # One service runs the Streamlit UI and its FastAPI backend together.
  # Optional: set DATABASE_URL (Postgres) so accounts and models survive
  # restarts; without it the backend uses a local SQLite file.
  - type: web
    name: medishield-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
